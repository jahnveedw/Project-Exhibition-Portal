<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-div">
        <header>
            <h1>Student Dashboard</h1>
        </header>
        </div>
        <div class="logout-container">
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </div>
        
        <div class="student-info">
            <div class="info-card">
                <h3>CGPA</h3>
                <p class="value">8.5</p>
            </div>
        </div>
        
        <div class="project-tabs">
            <a class="tab-btn" href="student_myapplication.html">My Applications</a>
            <a class="tab-btn" href="student_selectedapplication.html">Selected Applications</a>
        </div>
        
        <div class="browse-section">
            <h2>Available Projects</h2>
        </div>
        
        <div class="empty-state">
            <h2>No Projects Available</h2>
            <p>There are currently no projects available for application.</p>
        </div>
        
        
    </div>

    <script src="main.js"></script>
</body>
</html>
